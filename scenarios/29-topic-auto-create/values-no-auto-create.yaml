# Scenario 29: turn OFF automatic topic creation.
# auto.create.topics.enable is a read-only broker config, so it can only change with a restart - that is
# why this goes through Helm instead of kafka-configs.sh.
#
# Apply (PowerShell, from the project folder):
#   helm upgrade kafka oci://registry-1.docker.io/bitnamicharts/kafka --version 32.4.3 -n kafka-lab `
#     -f lab/values.yaml -f scenarios/29-topic-auto-create/values-no-auto-create.yaml --wait --timeout 10m
#
# Undo: the same command without the second -f, or: wsl -d Ubuntu -- bash cleanup.sh 29
# (the rest of the lab expects auto-creation to be ON, so don't leave it like this).
overrideConfiguration:
  auto.create.topics.enable: "false"
